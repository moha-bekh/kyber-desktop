variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-bookworm:20230721071624
  UBUNTU_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/ubuntu-jammy:20230623135215
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20230623134530
  MACOS_RUST_VERSION: 1.70.0

stages:
  - lint
  - contrib
  - build
  - test
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

.contrib-linux-x86_64-common:
  stage: contrib
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-linux.sh -d -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

.build-linux-x86_64-common:
  stage: build
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output name
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_STAGGING_DIRECTORY=$KYBER_BASE_DIR-$CI_COMMIT_TAG
    else
      export KYBER_STAGGING_DIRECTORY=$KYBER_BASE_DIR-$CI_COMMIT_SHORT_SHA
    fi
    # Build
    ./build-linux.sh -s -p -o $ROOTFS_PATH

.test-linux-x86_64-common:
  stage: test
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -t -o $ROOTFS_PATH

.clippy-linux-x86_64-common:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-bookworm-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -c -o $ROOTFS_PATH

contrib-debian-bookworm-x86_64:
  extends: .contrib-linux-x86_64-common
  image: $DEBIAN_IMAGE

build-debian-bookworm-x86_64:
  extends: .build-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-bookworm-x86_64
  variables:
    KYBER_BASE_DIR: "kyber-debian-bookworm-x86_64"
  artifacts:
    paths:
      - kyber-debian-bookworm-x86_64*.tar.bz2
    expire_in: 1 week

test-debian-bookworm-x86_64:
  extends: .test-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-bookworm-x86_64

clippy-debian-bookworm-x86_64:
  extends: .clippy-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-bookworm-x86_64

contrib-ubuntu-jammy-x86_64:
  extends: .contrib-linux-x86_64-common
  image: $UBUNTU_IMAGE
  when: manual

build-ubuntu-jammy-x86_64:
  extends: .build-linux-x86_64-common
  image: $UBUNTU_IMAGE
  needs:
    - contrib-ubuntu-jammy-x86_64
  variables:
    KYBER_BASE_DIR: "kyber-ubuntu-jammy-x86_64"
  artifacts:
    paths:
      - kyber-ubuntu-jammy-x86_64*.tar.bz2
    expire_in: 1 week

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-win32.sh -d -w -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output name
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_STAGGING_DIRECTORY=kyber-windows-x86_64-$CI_COMMIT_TAG
    else
      export KYBER_STAGGING_DIRECTORY=kyber-windows-x86_64-$CI_COMMIT_SHORT_SHA
    fi
    # Build
    ./build-win32.sh -s -p -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-windows-x86_64-*.zip
    expire_in: 1 week

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-win32.sh -s -c -o $ROOTFS_PATH

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.contrib-macos-common:
  extends: .macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-macos.sh -d -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output name
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_APP_DIRECTORY=kyber-client-$HOST_ARCH-$CI_COMMIT_TAG.app
    else
      export KYBER_APP_DIRECTORY=kyber-client-$HOST_ARCH-$CI_COMMIT_SHORT_SHA.app
    fi
    # Build
    ./build-macos.sh -s -p -a $HOST_ARCH -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-client-*.app.zip
    expire_in: 1 week

contrib-macos-x86_64:
  extends: .contrib-macos-common
  variables: *variables-macos-x86_64

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

contrib-macos-arm64:
  extends: .contrib-macos-common
  variables: *variables-macos-arm64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64
