variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-bullseye:20221108113934
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20221108114804
  MACOS_RUST_VERSION: 1.65.0

stages:
  - lint
  - contrib
  - build
  - test
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

contrib-debian-buster-x86_64:
  stage: contrib
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-linux.sh -d -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

build-debian-buster-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-buster-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -p -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-debian-buster-x86_64.tar.bz2
    expire_in: 1 week

test-debian-buster-x86_64:
  stage: test
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-buster-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -t -o $ROOTFS_PATH

clippy-debian-buster-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-buster-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -c -o $ROOTFS_PATH

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-win32.sh -d -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-win32.sh -s -p -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-windows-x86_64.zip
    expire_in: 1 week

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-win32.sh -s -c -o $ROOTFS_PATH

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.contrib-macos-common:
  extends: .macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-macos.sh -d -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-macos.sh -s -p -a $HOST_ARCH -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-client.app.zip
    expire_in: 1 week

contrib-macos-x86_64:
  extends: .contrib-macos-common
  variables: *variables-macos-x86_64

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

contrib-macos-arm64:
  extends: .contrib-macos-common
  variables: *variables-macos-arm64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64
