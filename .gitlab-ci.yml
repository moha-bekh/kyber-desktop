variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_IMAGE: ${CI_REGISTRY}/${ROOT_NAMESPACE}/ops/docker-images/debian-trixie:82eefa1cd6bf2f1365708bbf980f6b667898b20a
  UBUNTU_IMAGE: ${CI_REGISTRY}/${ROOT_NAMESPACE}/ops/docker-images/ubuntu-noble:82eefa1cd6bf2f1365708bbf980f6b667898b20a
  WIN64_IMAGE: ${CI_REGISTRY}/${ROOT_NAMESPACE}/ops/docker-images/debian-win64:a3d1e282885b1ef5fd5fdbbf7a7d8e0b3a33de15
  MACOS_RUST_VERSION: 1.89.0
stages:
  - lint
  - contrib
  - build
  - test
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

.contrib-linux-x86_64-common:
  stage: contrib
  tags:
    - heavy
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-linux.sh -d -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

.build-linux-x86_64-common:
  stage: build
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output name
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_STAGING_DIRECTORY=$KYBER_BASE_DIR-$CI_COMMIT_TAG
    else
      export KYBER_STAGING_DIRECTORY=$KYBER_BASE_DIR-$CI_COMMIT_SHORT_SHA
    fi
    # Build
    ./build-linux.sh -s -p -o $ROOTFS_PATH

.test-linux-x86_64-common:
  stage: test
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -t -o $ROOTFS_PATH

.clippy-linux-x86_64-common:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-linux.sh -s -c -o $ROOTFS_PATH

contrib-debian-trixie-x86_64:
  extends: .contrib-linux-x86_64-common
  image: $DEBIAN_IMAGE

build-debian-trixie-x86_64:
  extends: .build-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-trixie-x86_64
  variables:
    KYBER_BASE_DIR: "kyber-debian-trixie-x86_64"
  artifacts:
    paths:
      - kyber-debian-trixie-x86_64*.tar.bz2
    expire_in: 1 week

test-debian-trixie-x86_64:
  extends: .test-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-trixie-x86_64

clippy-debian-trixie-x86_64:
  extends: .clippy-linux-x86_64-common
  image: $DEBIAN_IMAGE
  needs:
    - contrib-debian-trixie-x86_64

contrib-ubuntu-noble-x86_64:
  extends: .contrib-linux-x86_64-common
  image: $UBUNTU_IMAGE
  when: manual

build-ubuntu-noble-x86_64:
  extends: .build-linux-x86_64-common
  image: $UBUNTU_IMAGE
  needs:
    - contrib-ubuntu-noble-x86_64
  variables:
    KYBER_BASE_DIR: "kyber-ubuntu-noble-x86_64"
  artifacts:
    paths:
      - kyber-ubuntu-noble-x86_64*.tar.bz2
    expire_in: 1 week

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - heavy
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-win32.sh -d -w -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
    expire_in: 1 week

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output name
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_STAGING_DIRECTORY=kyber-windows-x86_64-$CI_COMMIT_TAG
    else
      export KYBER_STAGING_DIRECTORY=kyber-windows-x86_64-$CI_COMMIT_SHORT_SHA
    fi
    # Build
    ./build-win32.sh -s -p -w -o $ROOTFS_PATH
  artifacts:
    paths:
      - kyber-windows-x86_64-*.zip
    expire_in: 1 week

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    ./build-win32.sh -s -c -o $ROOTFS_PATH

.macos-common:
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 1
    GIT_SUBMODULE_DEPTH: 1
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.contrib-macos-common:
  extends: .macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./build-macos.sh -d -a $HOST_ARCH -o $KYBER_PREFIX both
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs
      - kysdk/kymedia/builddir-macos/meson-logs
      - kysdk/kymedia/builddir-macos/subprojects/FFmpeg-n8.1/build/ffbuild/config.log
    expire_in: 1 week
    when: always

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Set output names (both targets, one job)
    if [ -n "$CI_COMMIT_TAG" ]; then
      export KYBER_CLIENT_APP_DIRECTORY=Kyber-Client-$HOST_ARCH-$CI_COMMIT_TAG.app
      export KYBER_SERVER_APP_DIRECTORY=Kyber-Server-$HOST_ARCH-$CI_COMMIT_TAG.app
    else
      export KYBER_CLIENT_APP_DIRECTORY=Kyber-Client-$HOST_ARCH-$CI_COMMIT_SHORT_SHA.app
      export KYBER_SERVER_APP_DIRECTORY=Kyber-Server-$HOST_ARCH-$CI_COMMIT_SHORT_SHA.app
    fi
    # Build both client and server in one shot
    ./build-macos.sh -s -p -a $HOST_ARCH -o $ROOTFS_PATH both
  artifacts:
    paths:
      - Kyber-Client-*.app.zip
      - Kyber-Server-*.dmg
    expire_in: 1 week

contrib-macos-x86_64:
  extends: .contrib-macos-common
  when: manual
  variables: *variables-macos-x86_64

build-macos-x86_64:
  extends: .build-macos-common
  when: manual
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

contrib-macos-arm64:
  extends: .contrib-macos-common
  variables: *variables-macos-arm64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64
