[avserver]
# Configure the video encoder to use
#
# Possible values: "x264", "nvenc", "qsv", "amf", "vaapi"
#
# Default: "nvenc"
encoder = "nvenc"

# Enable or disable Intra Refresh
#
# Only supported when using Kymux + nvenc
#
# Default: true
#intra_refresh = true

# Configure the clock used to generate PTS
#
# Used for both audio and video
#
# Possible values: "ZeroedOrigin", "System"
#
# Default: "ZeroedOrigin"
#clock_type = "ZeroedOrigin"

# Configure the minimum allowed bitrate
#
# Default: 5 mbps
#minimum_bitrate = 5000000

[controller]
# Listening port
#
# Used for the HTTP server (TCP) and Quic connection (UDP)
#
# Default: 8080
#port = 8080

# Override data plane listening port
#
# Used for Quic connection (UDP).
#
# Warning:
# * Overrides value for data plane even if controller.port is set
# * This is likely to break controllers deployed behind a NAT.
#   To make it work, NAT forwarding rule in the router must not change to UDP
#   port during redirection
#
#dataplane_port = 8080

# TLS certificate and key paths
#
# Allows specifying custom TLS certificates for production deployments.
#
# Default: "kybertest_cert.pem" / "kybertest_key.pem"
#tls_cert = "/path/to/server_cert.pem"
#tls_key = "/path/to/server_key.pem"

# Generate dynamically a certificate for Webtransport connections
# Will be used by the web client to fill serverCertificateHashes field when
# opening a Webtransport connection.
#
# MDN ref: https://developer.mozilla.org/en-US/docs/Web/API/WebTransport/WebTransport#servercertificatehashes
#
# Default: true
#webtransport_gen_certificate = true

[controller.session]
# Downgrade `SameSite` session cookie attribute to "SameSite: none; Secure".
#
# Warning: This is intended for dev environments and **SHOULD NOT** be disabled
# on production environments. The strict SameSite restriction is the only
# protection that Kyber leverages against CSRF attacks.
# Default: false
disable_same_site_protection = false

# JWT authentication backend
# 
# Setup the JWT expected token signature.
[controller.auth.jwt]
# Warning: For now, only HS256 or RS256 are officially supported.
# Default: "HS256"
#algorithm = "HS256"

# The key can either be filled as plain text or as a filesystem path.
# Default: "{ plain = "kyber-authentication-development-key" }"
#key = { plain = "kyber-authentication-development-key" }
#key = { file = "/tmp/RSA256-pub.pem" }

[inputserver]
# Force to plug Xbox 360 controllers
#
# Only supported on Windows
#
# Default: false
#gamepad_force_xbox360 = false

# Allow clipboard to be read
#
# Default: true
#clipboard_allow_copy = true

# Allow clipboard to be written
#
# Default: true
#clipboard_allow_paste = true

# Enable key repetition
#
# Host side
# Only supported on Windows
#
# Default: true
#keyboard_key_repeat = true

[windows_service.kidd]
# Enable or disable Kidd
#
# Possible values
# * true: Kidd is enabled
# * false: Kidd is disabled
#
# Default: true
#enabled = true

# Define the strategy to apply to plug a screen or not
#
# Possible values:
# * "when_no_monitor": Plug monitors only if no monitor is detected
# * "always": Always plug the configured number of monitors
# * "minimal_monitor_count": Plug only enough monitors to reach monitor_count
#
# Default: "minimal_monitor_count"
#plug_strategy = "minimal_monitor_count"

# Number of virtual monitors to create
#
# Default: 1
#monitor_count = 1

# Add one or more display mode for the plugged monitor.
# The section can be specified multiple times to add multiple modes.
#[[windows_service.kidd.extra_modes]]
#width = 1920
#height = 800
#vsync = 60
