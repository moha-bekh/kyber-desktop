[kyavserver]
# Configure the video encoder to use
#
# Possible values: "x264", "nvenc", "qsv", "amf", "vaapi"
#
# Default: "nvenc"
#encoder = "nvenc"

# Linux: Select screen capture backend
#
# Possible values: "nvfbc", "drm", "xcb", "wlroots"
#
# Default: "nvfbc"
#
# NvFBC: Works only with Nvidia GPUs with X11 and nvenc encoder.
# DRM/KMS: Works on non Nvidia GPUs with vaapi encoder.
# XCB: Generic X11 fallback (CPU-side RGB capture). Works with any encoder.
# Wlroots: wlroots screencopy/dmabuf capture. Works with any encoder.
#grab_backend = "nvfbc"

# Enable or disable Intra Refresh
#
# Only supported when using Kymux + nvenc
#
# Default: true
#intra_refresh = true

# Configure the clock used to generate PTS
#
# Used for both audio and video
#
# Possible values: "ZeroedOrigin", "System"
#
# Default: "ZeroedOrigin"
#clock_type = "ZeroedOrigin"

# Configure the minimum allowed bitrate
#
# Default: 5 mbps
#minimum_bitrate = 5000000

#[kyavserver.watermark]
# Configure the watermark overlay
#
# The watermark is drawn on top of the encoded video.
# Supported formats: PNG.
#
# Default: none
#file = "./logo.png"

# Configure the horizontal position of the watermark
#
# Normalized coordinates:
# * -1.0: left
# *  0.0: center
# *  1.0: right
#
# Default: 0.0
#x = 0.0

# Configure the vertical position of the watermark
#
# Normalized coordinates:
# * -1.0: bottom
# *  0.0: center
# *  1.0: top
#
# Default: 0.0
#y = 0.0

[kycontroller]
# Enable or disable the system tray icon (Windows only)
#
# Default: true
#tray = true

# Listening port
#
# Used for the HTTP server (TCP) and Quic connection (UDP)
#
# Default: 8080
#port = 8080

# Configure IP version for listening
#
# Possible values: "ipv4", "dual_stack"
#
# Default: "dual_stack"
#listen_mode = "dual_stack"

# Override data plane listening port
#
# Used for Quic connection (UDP).
#
# Warning:
# * Overrides value for data plane even if kycontroller.port is set
# * This is likely to break controllers deployed behind a NAT.
#   To make it work, NAT forwarding rule in the router must not change to UDP
#   port during redirection
#
#dataplane_port = 8080

# TLS certificate and key paths
#
# Allows specifying custom TLS certificates for production deployments.
#
# Default: "kybertest_cert.pem" / "kybertest_key.pem"
#tls_cert = "/path/to/server_cert.pem"
#tls_key = "/path/to/server_key.pem"

# Generate dynamically a certificate for Webtransport connections
# Will be used by the web client to fill serverCertificateHashes field when
# opening a Webtransport connection.
#
# MDN ref: https://developer.mozilla.org/en-US/docs/Web/API/WebTransport/WebTransport#servercertificatehashes
#
# Default: true
#webtransport_gen_certificate = true

# Allow multiple concurrent clients to share a streaming session
#
# When false, only one client can be logged in at a time. A second
# login attempt while a session is active is rejected with 409 Conflict.
# Video/audio is encoded per-session and forwarded directly to the client
# (lowest latency, full backpressure from client to encoder).
#
# When true (default), multiple clients can stream concurrently. Video/audio is
# encoded once per display/audio source and fanned out to all clients via a
# broadcast duplicator (kydup). The RTP backend is not available in this mode.
#
# Default: true
#multi_client = true

# Path to the web client directory served under /webclient
#
# When unset, the controller looks for a "webclient" folder next to the
# executable (on Linux, one level above the "bin" directory). Set an absolute
# path to serve the web client from a custom location.
#
# On Windows, use forward slashes. Windows accepts "/" as a path separator, and
# in a TOML string a backslash is an escape character (so "C:\path" is invalid
# and would need "C:\\path").
#
# Default: derived from the executable location
#webclient = "C:/absolute/path/to/webclient"

[kycontroller.security]
# List of origins allowed to query the controller via cross-origin requests.
#
# WARNING: This security option is related to browser CSRF protection and is
# strict enough by default, tweak it only in cases of unexpected unauthorized
# access errors.
#
# The trusted origins list is matched against the `Origin` header shared by the
# browser on cross-origin requests, the match is not performed on same-origin
# requests for convenience, so including the host of the controller is not
# necessary.
#
# It's advised to fully understand the concepts and implications of
# same-origin, same-site and cross-site requests to properly configure the
# controller trusted origin list:
#    - [Sec-Fetch-Site directives](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Sec-Fetch-Site#directives)
#    - [Site definition](https://developer.mozilla.org/en-US/docs/Glossary/Site)
#    - [Origin definition](https://developer.mozilla.org/en-US/docs/Glossary/Origin)
#
# Accepted values:
#    - An array of valid origin strings (https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Origin#syntax)
#    - A single "*" string
# Default: []
trusted_origins = []

# Specify whether the controller should only receive requests originating from
# the same site
#
# WARNING: This security option is related to browser CSRF protection and is
# strict enough by default, tweak it only in cases of unexpected unauthorized
# access errors.
#
# Applies the `SameSite: Strict` attribute to the session cookie, which ensures
# that the cookie does not get shared with other sites. This should **only** be
# disabled in cross-site scenarios.
#
# Refs:
#    - [SameSite attribute](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie#samesitesamesite-value)
#    - [Site definition](https://developer.mozilla.org/en-US/docs/Glossary/Site)
#
# Default: true
same_site = true

# Basic authentication backend
#
# Setup the "Basic" HTTP authentication scheme allowed users
[kycontroller.auth.basic]
# Enable/Disable the backend.
# Default: true
enabled = true

# List of allowed login pairs.
#   - username: A string representing the user name
#   - password: A Sha256Sum of the password
# Strings must be compliant to RFC 7617.
# Default: []
logins = [
    { username = "Default user", password = "c2bb5d1edbff196e3a879ec0a59aeb3952822266909b5ba07b45072d20a05446" },
]

# JWT authentication backend
# 
# Setup the JWT expected token signature.
[kycontroller.auth.jwt]
# Enable/Disable the backend.
# Default: true
enabled = true

# Specify the token signature algorithm.
#
# Supported values:
#   - HS256: symmetrical HMAC, useful for testing but weak security guarantees
#   - RS256: asymmetrical RSA, Kyber uses an RSA public key
# Default: "HS256"
#algorithm = "HS256"

# Specify the token signature decoding key.
#
# The key can either be filled as plain text, with the `plain` attribute or as
# a filesystem path with the `file` attribute.
#
# ## HS256 key
#
# The key string should contain the HMAC secret key.
#
# ```toml
# key = { plain = "Secret-key" }
# ```
#
# ## RS256 key
#
# The key string should contain a PEM encoded RS256 public key in the PKCS#8 format.
#
# ```toml
# key = { file = "/tmp/RS256-pub.pem" }
# ```
#
# Default: { plain = "kyber-authentication-development-key" }
#key = { file = "public.pem" }

# OIDC authentication backend
#
# Delegates authentication to an external OpenID Connect provider.
# Clients discover the issuer and client_id from the controller's
# WWW-Authenticate challenge, then perform Authorization Code + PKCE.
#
# Example with Keycloak:
#
#   [kycontroller.auth.oidc]
#   enabled = true
#   issuer = "https://keycloak.example.com/realms/myrealm"
#   client_id = "kyber-app"
#   identity_claim = "email"
#   allowed_identifiers = ["alice@example.com"]
#   allowed_groups = ["friends"]
#
[kycontroller.auth.oidc]
# Enable/Disable the backend.
# Default: false
enabled = false

# OIDC issuer URL. Must support OpenID Connect Discovery
# (/.well-known/openid-configuration).
# issuer = "https://keycloak.example.com/realms/myrealm"

# OAuth2 public client ID registered with the provider.
# client_id = "kyber-app"

# JWT claim used to identify the user.
# Supported values: "sub" (default), "email", "preferred_username"
# identity_claim = "sub"

# Access control lists (OR logic):
#   - If both lists are empty, all authenticated users are allowed.
#   - If either list is set, the user must match at least one entry
#     in allowed_identifiers OR belong to at least one allowed_groups.
#   - The groups claim must be present in the access token (configure
#     a "groups" client scope in the IdP).

# Allowed user identities (matched against identity_claim).
# allowed_identifiers = ["alice@example.com", "bob@example.com"]

# Allowed group memberships.
# allowed_groups = ["friends", "admins"]

# How long (in seconds) the JWKS key set is cached before re-fetching.
# A kid miss always triggers an immediate refresh regardless of TTL.
# Default: 300 (5 minutes)
# jwks_cache_ttl = 300

[kynputserver]
# Force to plug Xbox 360 controllers
#
# Only supported on Windows
#
# Default: false
#gamepad_force_xbox360 = false

# Allow clipboard to be read
#
# Default: true
#clipboard_allow_copy = true

# Allow clipboard to be written
#
# Default: true
#clipboard_allow_paste = true

# Enable key repetition
#
# Host side
# Only supported on Windows
#
# Default: true
#keyboard_key_repeat = true

[kyservice.kidd]
# Enable or disable Kidd
#
# Possible values
# * true: Kidd is enabled
# * false: Kidd is disabled
#
# Default: true
#enabled = true

# Define the strategy to apply to plug a screen or not
#
# Possible values:
# * "when_no_monitor": Plug monitors only if no monitor is detected
# * "always": Always plug the configured number of monitors
# * "minimal_monitor_count": Plug only enough monitors to reach monitor_count
#
# Default: "minimal_monitor_count"
#plug_strategy = "minimal_monitor_count"

# Number of virtual monitors to create
#
# Default: 1
#monitor_count = 1

# Add one or more display mode for the plugged monitor.
# The section can be specified multiple times to add multiple modes.
#[[kyservice.kidd.extra_modes]]
#width = 1920
#height = 800
#vsync = 60
