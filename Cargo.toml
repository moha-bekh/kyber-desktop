[workspace]

members = [
    "desktop",
]

exclude = [
    "avserver",
    "controller",
    "libclient",
    "libkynput",
    "libkypc",
    "kymux",
]

[patch.crates-io]
libclient-rs = { path = "libclient/libclient-rs" }
libclient-sys = { path = "libclient/libclient-rs/libclient-sys" }
libkynput-rs = { path = "libkynput/libkynput-rs" }
libkynput-sys = { path = "libkynput/libkynput-rs/libkynput-sys" }
winit = { path = "external/winit" }
