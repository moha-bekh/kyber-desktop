[workspace]

resolver = "2"

members = [
    "desktop",
]

exclude = [
    "kysdk",
]

[patch.crates-io]
libclient-common = { path = "kysdk/kyctl/libclient-common" }
libclient-rs = { path = "kysdk/kyctl/libclient-rs" }
libclient-sys = { path = "kysdk/kyctl/libclient-rs/libclient-sys" }
kynput-rs = { path = "kysdk/kynput/kynput-rs" }
kynput-sys = { path = "kysdk/kynput/kynput-rs/kynput-sys" }
winit = { path = "external/winit" }
