[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.51"
clap = "3.2.8"
ctrlc = "3.2.1"
env_logger = "0.9.0"
keycode = "0.3.0"
libc = "0.2.107"
log = "0.4.14"
raw-window-handle = "0.4.2"
reqwest = { version = "0.11.6", features = ["json"] }
serde = "1.0.130"
serde_json = "1.0.70"
tokio = { version = "1.13.1", features = ["rt-multi-thread", "sync"] }

libclient-rs = "0.1.0"
libkynput-rs = "0.1.0"
winit = { version = "0.26.0", features = ["x11"] }

[dev-dependencies]
mockall = "0.10.2"
serial_test = "0.5.1"
