[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.78"
clap = "3.2.22"
ctrlc = "3.4.4"
keycode = "0.3.0"
libc = "0.2.153"
log = "0.4.21"
log4rs = "1.3.0"
raw-window-handle = "0.5.0"

libclient-rs = "0.1.0"
libkynput-rs = "0.1.0"
winit = { version = "0.28.1", features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.1", default-features = false, features = ["ico"] }

[dev-dependencies]
env_logger = "0.11.3"
mockall = "0.12.1"
serial_test = "3.0.0"

[features]
default = ["test-tls-cert"]
test-tls-cert = []
win32-hide-console = []

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gix"] }
