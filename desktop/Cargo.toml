[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.51"
clap = "3.2.8"
ctrlc = "3.2.1"
keycode = "0.3.0"
libc = "0.2.107"
log = "0.4.14"
log4rs = "1.2.0"
raw-window-handle = "0.5.0"

libclient-rs = "0.1.0"
libkynput-rs = "0.1.0"
winit = { version = "0.28.1", features = ["x11"] }

[dev-dependencies]
mockall = "0.11.3"
serial_test = "0.9.0"

[build-dependencies]
vergen = { version = "8.1.1", features = ["build", "git", "gix"] }
